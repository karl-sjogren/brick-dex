<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Top-down 2x2 brick -->
  <g transform="translate(2, 2)">
    <!-- Brick body (yellow filled) -->
    <rect x="0" y="0" width="28" height="28" rx="4" fill="#ffcf00"/>

    <!-- 4 studs (2 rows of 2) - red -->
    <circle cx="8" cy="8" r="5" fill="#e3000b"/>
    <circle cx="20" cy="8" r="5" fill="#e3000b"/>
    <circle cx="8" cy="20" r="5" fill="#e3000b"/>
    <circle cx="20" cy="20" r="5" fill="#e3000b"/>

    <!-- Stud highlights -->
    <circle cx="8" cy="8" r="2.2" fill="#ff4444" opacity="0.5"/>
    <circle cx="20" cy="8" r="2.2" fill="#ff4444" opacity="0.5"/>
    <circle cx="8" cy="20" r="2.2" fill="#ff4444" opacity="0.5"/>
    <circle cx="20" cy="20" r="2.2" fill="#ff4444" opacity="0.5"/>
  </g>
</svg>
